<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8">
  <title>SOP Flying UAV Checklist</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563eb">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="config.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen pb-12 font-sans flex flex-col justify-between">

  <div>
    <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-50 backdrop-blur-md bg-opacity-80">
      <div class="max-w-5xl mx-auto px-4 py-4 flex justify-between items-center">
        <div class="flex items-center space-x-3">
          <div class="bg-blue-600/20 p-1.5 rounded-lg border border-blue-500/30 flex items-center justify-center">
            <img src="https://lh3.googleusercontent.com/d/1VKyZsEP3mWBMQ6p9tpOgkpCoCgoUNCA_" alt="Logo PT Multisarana Avindo" class="h-9 w-auto object-contain">
          </div>
          <div>
            <h1 class="text-lg font-bold text-slate-100 tracking-wide">PT MULTISARANA AVINDO</h1>
            <p class="text-xs text-slate-400">CHECKLIST SOP FLYING UAV - DJI PHANTOM 4 PRO V2</p>
          </div>
        </div>

        <a href="dashboard.html" class="text-xs bg-slate-800 hover:bg-slate-700 text-blue-400 px-3 py-2 rounded-lg border border-slate-700 transition duration-200">
          <i class="fa-solid fa-chart-line mr-1"></i> Dashboard
        </a>
      </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 mt-8">
      <form id="checklistForm" onsubmit="handleSubmit(event)" class="space-y-6">
        <!-- Section Informasi Penerbangan -->
        <div class="bg-slate-900 border border-slate-800 rounded-xl p-6 shadow-xl relative overflow-hidden">
          <div class="absolute top-0 left-0 w-1 h-full bg-blue-500"></div>
          <h2 class="text-md font-semibold text-blue-400 uppercase tracking-wider mb-4 flex items-center gap-2">
            <i class="fa-solid fa-clipboard-list"></i> Informasi Penerbangan
          </h2>
          <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            <div>
              <label class="block text-xs font-medium text-slate-400 mb-1">Operator Name</label>
              <select name="operatorName" id="operatorSelect" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-blue-500">
                <option value="">-- Memuat Data User --</option>
              </select>
            </div>
            <div>
              <label class="block text-xs font-medium text-slate-400 mb-1">Spektator Name</label>
              <select name="spektatorName" id="spektatorSelect" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-blue-500">
                <option value="">-- Memuat Data User --</option>
              </select>
            </div>
            <div>
              <label class="block text-xs font-medium text-slate-400 mb-1">Date</label>
              <input type="date" name="date" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-blue-500">
            </div>
            <div>
              <label class="block text-xs font-medium text-slate-400 mb-1">Location</label>
              <input type="text" name="location" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-blue-500">
            </div>
            <div>
              <label class="block text-xs font-medium text-slate-400 mb-1">Plan</label>
              <input type="text" name="plan" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-blue-500">
            </div>
            <div>
              <label class="block text-xs font-medium text-slate-400 mb-1">Altitude (m AGL)</label>
              <input type="number" name="altitude" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-blue-500">
            </div>
            <div>
              <label class="block text-xs font-medium text-slate-400 mb-1">Time Start</label>
              <input type="time" name="timeStart" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-blue-500">
            </div>
            <div>
              <label class="block text-xs font-medium text-slate-400 mb-1">Time End</label>
              <input type="time" name="timeEnd" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-blue-500">
            </div>
          </div>
        </div>

        <!-- Section 1: Early Preparation -->
        <div class="bg-slate-900 border border-slate-800 rounded-xl p-6 shadow-xl space-y-4">
          <h2 class="text-md font-semibold text-emerald-400 uppercase tracking-wider">1. Early Preparation</h2>
          <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3 p-4 bg-slate-950/60 rounded-xl border border-slate-800/80">
            <div>
              <label class="block text-xs text-slate-400 mb-1">Kapasitas Baterai Drone (%)</label>
              <input type="number" min="0" max="100" name="droneBatteryLevel" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-slate-200">
            </div>
            <div>
              <label class="block text-xs text-slate-400 mb-1">Suhu Baterai Drone (°C)</label>
              <input type="number" step="0.1" name="droneBatteryTemp" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-slate-200">
            </div>
            <div>
              <label class="block text-xs text-slate-400 mb-1">Kapasitas Baterai Remote (%)</label>
              <input type="number" min="0" max="100" name="rcBatteryLevel" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-slate-200">
            </div>
            <div>
              <label class="block text-xs text-slate-400 mb-1">Kondisi Cuaca</label>
              <select name="weatherCondition" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-slate-200">
                <option value="Cerah">Cerah</option>
                <option value="Berawan">Berawan</option>
                <option value="Mendung">Mendung</option>
                <option value="Hujan Gerimis">Hujan Gerimis</option>
                <option value="Berangin">Berangin</option>
              </select>
            </div>
            <div>
              <label class="block text-xs text-slate-400 mb-1">Suhu Udara Lingkungan (°C)</label>
              <input type="number" step="0.1" name="ambientTemp" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-slate-200">
            </div>
          </div>

          <div class="space-y-3 text-sm pt-2">
            <label class="flex items-start gap-3 p-2 hover:bg-slate-800/50 rounded-lg cursor-pointer">
              <input type="checkbox" name="earlyPrep" value="Device Condition & Helipad" class="mt-1 accent-blue-500 w-4 h-4">
              <span class="text-slate-300">Check Device Condition & Helipad Condition</span>
            </label>
            <label class="flex items-center gap-3 p-2 hover:bg-slate-800/50 rounded-lg cursor-pointer">
              <input type="checkbox" name="earlyPrep" value="Drone Battery Level" class="accent-blue-500 w-4 h-4">
              <span class="text-slate-300">Check Drone Battery Level & Temp</span>
            </label>
            <label class="flex items-center gap-3 p-2 hover:bg-slate-800/50 rounded-lg cursor-pointer">
              <input type="checkbox" name="earlyPrep" value="Remote Controller Battery Level" class="accent-blue-500 w-4 h-4">
              <span class="text-slate-300">Check Remote Controller Battery Level</span>
            </label>
            <label class="flex items-center gap-3 p-2 hover:bg-slate-800/50 rounded-lg cursor-pointer">
              <input type="checkbox" name="earlyPrep" value="SD Card & Capacity" class="accent-blue-500 w-4 h-4">
              <span class="text-slate-300">Check SD Card & Capacity</span>
            </label>
          </div>
          <input type="text" name="earlyPrepRemarks" placeholder="Catatan/Problem Reason..." class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs text-slate-300 mt-2">
        </div>

        <!-- Section 2: Preparing The Aircraft -->
        <div class="bg-slate-900 border border-slate-800 rounded-xl p-6 shadow-xl">
          <h2 class="text-md font-semibold text-emerald-400 uppercase tracking-wider mb-4">2. Preparing The Aircraft</h2>
          <div class="space-y-3 text-sm">
            <label class="flex items-center gap-3 p-2 hover:bg-slate-800/50 rounded-lg cursor-pointer">
              <input type="checkbox" name="aircraftPrep" value="Prepare Helipad" class="accent-blue-500 w-4 h-4">
              <span class="text-slate-300">Prepare The Helipad on a Flat & Open Area</span>
            </label>
            <label class="flex items-center gap-3 p-2 hover:bg-slate-800/50 rounded-lg cursor-pointer">
              <input type="checkbox" name="aircraftPrep" value="Mount Propellers" class="accent-blue-500 w-4 h-4">
              <span class="text-slate-300">Mount the Propellers</span>
            </label>
            <label class="flex items-center gap-3 p-2 hover:bg-slate-800/50 rounded-lg cursor-pointer">
              <input type="checkbox" name="aircraftPrep" value="Remove Gimbal Clamp" class="accent-blue-500 w-4 h-4">
              <span class="text-slate-300">Remove Gimbal Clamp</span>
            </label>
          </div>
          <input type="text" name="aircraftPrepRemarks" placeholder="Catatan/Problem Reason..." class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs text-slate-300 mt-4">
        </div>

        <!-- Section 3: Preparing Fly -->
        <div class="bg-slate-900 border border-slate-800 rounded-xl p-6 shadow-xl space-y-4">
          <h2 class="text-md font-semibold text-emerald-400 uppercase tracking-wider">3. Preparing Fly</h2>
          <div class="p-4 bg-slate-950/60 rounded-xl border border-slate-800/80 max-w-sm">
            <label class="block text-xs text-slate-400 mb-1">Jumlah Satelit Ter-lock (GPS Signal)</label>
            <input type="number" min="0" name="satellitesLocked" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-slate-200">
          </div>
          <div class="space-y-3 text-sm pt-2">
            <label class="flex items-center gap-3 p-2 hover:bg-slate-800/50 rounded-lg cursor-pointer">
              <input type="checkbox" name="flyPrep" value="Turn On Aircraft & RC" class="accent-blue-500 w-4 h-4">
              <span class="text-slate-300">Turn On Aircraft & Remote Controller</span>
            </label>
            <label class="flex items-center gap-3 p-2 hover:bg-slate-800/50 rounded-lg cursor-pointer">
              <input type="checkbox" name="flyPrep" value="Ready To Go (GPS)" class="accent-blue-500 w-4 h-4">
              <span class="text-slate-300">Ready To Go (GPS) Indicated</span>
            </label>
          </div>
          <input type="text" name="flyPrepRemarks" placeholder="Catatan/Problem Reason..." class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs text-slate-300 mt-2">
        </div>

        <!-- Section 4: Landing -->
        <div class="bg-slate-900 border border-slate-800 rounded-xl p-6 shadow-xl">
          <h2 class="text-md font-semibold text-emerald-400 uppercase tracking-wider mb-4">4. Landing</h2>
          <div class="space-y-3 text-sm">
            <label class="flex items-center gap-3 p-2 hover:bg-slate-800/50 rounded-lg cursor-pointer">
              <input type="checkbox" name="landingPrep" value="Land Aircraft" class="accent-blue-500 w-4 h-4">
              <span class="text-slate-300">Land The Aircraft</span>
            </label>
            <label class="flex items-center gap-3 p-2 hover:bg-slate-800/50 rounded-lg cursor-pointer">
              <input type="checkbox" name="landingPrep" value="Check Condition" class="accent-blue-500 w-4 h-4">
              <span class="text-slate-300">Check Post-Flight Aircraft Condition</span>
            </label>
          </div>
          <input type="text" name="landingPrepRemarks" placeholder="Catatan/Problem Reason..." class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs text-slate-300 mt-4">
        </div>

        <!-- Additional Note -->
        <div class="bg-slate-900 border border-slate-800 rounded-xl p-6 shadow-xl">
          <label class="block text-sm font-medium text-slate-300 mb-2">Note Tambahan</label>
          <textarea name="note" rows="3" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-sm text-slate-200" placeholder="Ketik catatan tambahan di sini..."></textarea>
        </div>

        <button type="submit" id="submitBtn" class="w-full bg-gradient-to-r from-blue-600 to-blue-700 hover:from-blue-500 hover:to-blue-600 text-white font-semibold py-3 rounded-xl shadow-lg transition duration-200 flex items-center justify-center gap-2">
          <i class="fa-solid fa-paper-plane"></i> Submit Checklist
        </button>
      </form>
    </main>
  </div>

  <footer class="mt-12 text-center text-xs text-slate-500 border-t border-slate-900 pt-6">
    <p>&copy; <span id="currentYear"></span> PT Multisarana Avindo. All rights reserved.</p>
  </footer>

  <script>
    document.getElementById('currentYear').innerText = new Date().getFullYear();

    // Fungsi pembersih URL
    function getCleanApiUrl() {
      if (typeof API_URL === 'undefined' || !API_URL) {
        console.error("API_URL belum dikonfigurasi di config.js");
        return null;
      }
      return API_URL.trim().split('?')[0];
    }

    // Memuat daftar user saat halaman dibuka
    window.onload = function() {
      const baseUrl = getCleanApiUrl();
      if (!baseUrl) {
        Swal.fire({ icon: 'error', title: 'Konfigurasi Error', text: 'API_URL belum diset pada config.js' });
        return;
      }

      const fetchUrl = `${baseUrl}?action=getUsers`;

      fetch(fetchUrl, {
        method: 'GET',
        redirect: 'follow'
      })
      .then(res => {
        if (!res.ok) throw new Error(`HTTP Error status: ${res.status}`);
        return res.json();
      })
      .then(res => {
        if (res.success) {
          populateUsers(res.data);
        } else {
          console.error("Gagal memuat user:", res.message);
          Swal.fire({ icon: 'warning', title: 'Peringatan', text: res.message });
        }
      })
      .catch(err => {
        console.error("Gagal Fetch Data User:", err);
        document.getElementById('operatorSelect').innerHTML = '<option value="">-- Gagal Memuat Data --</option>';
        document.getElementById('spektatorSelect').innerHTML = '<option value="">-- Gagal Memuat Data --</option>';
      });
    };

    function populateUsers(users) {
      const opSelect = document.getElementById('operatorSelect');
      const spSelect = document.getElementById('spektatorSelect');

      if (!users || users.length === 0) {
        opSelect.innerHTML = '<option value="">-- Tidak ada user --</option>';
        spSelect.innerHTML = '<option value="">-- Tidak ada user --</option>';
        return;
      }

      let optionsHTML = '<option value="">-- Pilih Nama --</option>';
      users.forEach(user => {
        optionsHTML += `<option value="${user}">${user}</option>`;
      });

      opSelect.innerHTML = optionsHTML;
      spSelect.innerHTML = optionsHTML;
    }

    // Menangani Submit Form
    function handleSubmit(e) {
      e.preventDefault();
      const baseUrl = getCleanApiUrl();
      if (!baseUrl) {
        Swal.fire({ icon: 'error', title: 'Error', text: 'API URL belum dikonfigurasi!' });
        return;
      }

      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Memproses...`;

      const form = e.target;
      const formData = new FormData(form);

      const data = {
        operatorName: formData.get('operatorName'),
        spektatorName: formData.get('spektatorName'),
        date: formData.get('date'),
        location: formData.get('location'),
        plan: formData.get('plan'),
        altitude: formData.get('altitude'),
        timeStart: formData.get('timeStart'),
        timeEnd: formData.get('timeEnd'),
        droneBatteryLevel: formData.get('droneBatteryLevel'),
        droneBatteryTemp: formData.get('droneBatteryTemp'),
        rcBatteryLevel: formData.get('rcBatteryLevel'),
        weatherCondition: formData.get('weatherCondition'),
        ambientTemp: formData.get('ambientTemp'),
        satellitesLocked: formData.get('satellitesLocked'),
        earlyPrep: formData.getAll('earlyPrep'),
        earlyPrepRemarks: formData.get('earlyPrepRemarks'),
        aircraftPrep: formData.getAll('aircraftPrep'),
        aircraftPrepRemarks: formData.get('aircraftPrepRemarks'),
        flyPrep: formData.getAll('flyPrep'),
        flyPrepRemarks: formData.get('flyPrepRemarks'),
        landingPrep: formData.getAll('landingPrep'),
        landingPrepRemarks: formData.get('landingPrepRemarks'),
        note: formData.get('note')
      };

      fetch(baseUrl, {
        method: 'POST',
        redirect: 'follow',
        headers: {
          'Content-Type': 'text/plain;charset=utf-8'
        },
        body: JSON.stringify(data)
      })
      .then(res => res.json())
      .then(res => {
        btn.disabled = false;
        btn.innerHTML = `<i class="fa-solid fa-paper-plane"></i> Submit Checklist`;
        if (res.success) {
          Swal.fire({ icon: 'success', title: 'Berhasil!', text: res.message, background: '#0f172a', color: '#f8fafc' });
          form.reset();
        } else {
          Swal.fire({ icon: 'error', title: 'Gagal!', text: res.message, background: '#0f172a', color: '#f8fafc' });
        }
      })
      .catch(err => {
        btn.disabled = false;
        btn.innerHTML = `<i class="fa-solid fa-paper-plane"></i> Submit Checklist`;
        Swal.fire({ icon: 'error', title: 'Error Network', text: err.toString(), background: '#0f172a', color: '#f8fafc' });
      });
    }

    // Register Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(reg => console.log('Service Worker Registered!'))
          .catch(err => console.error('Service Worker Registration Failed:', err));
      });
    }
  </script>
</body>
</html>
